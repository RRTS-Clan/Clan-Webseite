<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RRTS - Rapid Response Tactical Squad</title>
  <style>
    body {
      background-image: url("Hauptseite.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    img {
      max-width: 340px;
      cursor: pointer;
      filter: drop-shadow(0px 0px 18px rgba(0, 0, 0, 0.95));
      transition: transform 0.3s ease;
    }
    img:hover {
      transform: scale(1.08);
    }
    p {
      margin-top: 18px;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #c5a059;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="RRTS Clan Logo" onclick="passwortPruefen()">
  <p>Klicke auf das Patch für den Clan-Zugang</p>

  <script>
    function passwortPruefen() {
      var eingabe = prompt("Bitte Clan-Passwort eingeben:");
      if (eingabe === "RRTS2025CLAN") {
        window.location.href = "startseite.html";
      } else if (eingabe !== null) {
        alert("Zugriff verweigert! Falsches Passwort.");
      }
    }
  </script>

</body>
</html>
