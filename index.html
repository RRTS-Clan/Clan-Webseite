<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>RRTS - Rapid Response Tactical Squad</title>
  <style>
    body {
      background-image: url("Hauptseite.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }
    img {
      max-width: 340px;
      cursor: pointer;
      filter: drop-shadow(0px 0px 18px rgba(0, 0, 0, 0.95));
      transition: transform 0.3s ease;
    }
    img:hover { transform: scale(1.08); }
    p {
      margin-top: 18px;
      color: #ffffff;
      background-color: rgba(0, 0, 0, 0.75);
      padding: 10px 20px;
      border-radius: 6px;
      border: 1px solid #c5a059;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
    .top-controls {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    .ctrl-btn {
      background-color: rgba(15, 15, 15, 0.85);
      color: #c5a059;
      border: 1px solid #c5a059;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body onclick="starteHintergrund()">

  <div class="top-controls">
    <button class="ctrl-btn" id="langToggle" onclick="toggleLang(event)">DE</button>
    <button class="ctrl-btn" id="soundToggle" onclick="toggleSound(event)">🔊 Sound: An</button>
  </div>

  <a href="startseite.html" onclick="klickMitSound(event, 'Hauptlogo.mp3', 'startseite.html')">
    <img src="logo.png" alt="RRTS Clan Logo">
  </a>
  <p id="patchText">Klicke auf das Patch für den Clan-Zugang</p>

  <audio id="bgMusic" src="Hintergrund.mp3" loop></audio>

  <script>
    const bgMusic = document.getElementById("bgMusic");
    bgMusic.volume = 0.25;
    let soundAktiv = localStorage.getItem("rrtsSound") !== "aus";
    const sprachen = ["de", "en", "fr", "zh"];
    let lang = localStorage.getItem("rrtsLang") || "de";
    if (!sprachen.includes(lang)) lang = "de";

    const texte = {
      de: { patch: "Klicke auf das Patch für den Clan-Zugang", btn: "🇩🇪 DE", an: "🔊 Sound: An", aus: "🔇 Sound: Aus" },
      en: { patch: "Click the patch for clan access", btn: "🇬🇧 EN", an: "🔊 Sound: On", aus: "🔇 Sound: Off" },
      fr: { patch: "Cliquez sur l'écusson pour accéder au clan", btn: "🇫🇷 FR", an: "🔊 Son : Activé", aus: "🔇 Son : Coupé" },
      zh: { patch: "点击臂章进入战队", btn: "🇨🇳 中文", an: "🔊 音效：开", aus: "🔇 音效：关" }
    };

    function applyLang() {
      document.getElementById("patchText").innerText = texte[lang].patch;
      document.getElementById("langToggle").innerText = texte[lang].btn;
      updateSoundBtn();
    }

    function updateSoundBtn() {
      document.getElementById("soundToggle").innerText = soundAktiv ? texte[lang].an : texte[lang].aus;
    }

    function toggleLang(e) {
      e.stopPropagation();
      const nextIdx = (sprachen.indexOf(lang) + 1) % sprachen.length;
      lang = sprachen[nextIdx];
      localStorage.setItem("rrtsLang", lang);
      applyLang();
    }

    function starteHintergrund() {
      if (soundAktiv && bgMusic.paused) bgMusic.play().catch(() => {});
    }

    function toggleSound(e) {
      e.stopPropagation();
      soundAktiv = !soundAktiv;
      localStorage.setItem("rrtsSound", soundAktiv ? "an" : "aus");
      updateSoundBtn();
      if (soundAktiv) bgMusic.play().catch(() => {});
      else bgMusic.pause();
    }

    function klickMitSound(e, soundDatei, zielSeite) {
      e.preventDefault();
      e.stopPropagation();
      sessionStorage.setItem("rrtsMusicTime", bgMusic.currentTime);
      if (soundAktiv) {
        const sfx = new Audio(soundDatei);
        sfx.volume = 1.0;
        sfx.play().catch(() => {});
        setTimeout(() => { window.location.href = zielSeite; }, 900);
      } else {
        window.location.href = zielSeite;
      }
    }

    applyLang();
  </script>
</body>
</html>
